<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg-grad-kos" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="accent-grad-kos" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="shadow-kos" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#312e81" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg-grad-kos)" filter="url(#shadow-kos)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>

  <!-- Graphic Elements: Modern House / Room Unit with Keyhole & Windows -->
  <g fill="none" stroke="url(#accent-grad-kos)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Roof / Gable -->
    <path d="M36 56 L64 33 L92 56" stroke-width="6"/>
    <!-- Building Walls -->
    <path d="M43 53 V87 C43 90.3 45.7 93 49 93 H79 C82.3 93 85 90.3 85 87 V53" stroke-width="5"/>
    <!-- Doorway Frame -->
    <path d="M54 93 V68 C54 65.8 55.8 64 58 64 H70 C72.2 64 74 65.8 74 68 V93" stroke-width="4.5" fill="#4338ca" fill-opacity="0.35"/>
    <!-- Smart Keyhole / Door Handle -->
    <circle cx="68" cy="78" r="2.2" fill="#ffffff" stroke="none"/>
    <!-- Top Attic Window (4-pane minimal) -->
    <circle cx="64" cy="48" r="4.5" fill="#ffffff" fill-opacity="0.9" stroke="none"/>
  </g>
</svg>
