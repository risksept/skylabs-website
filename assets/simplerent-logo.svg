<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg-grad-rent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="accent-grad-rent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="shadow-rent" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0c4a6e" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg-grad-rent)" filter="url(#shadow-rent)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Graphic Elements: Modern Rental Key & Dynamic Handover Arc -->
  <g fill="none" stroke="url(#accent-grad-rent)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Circular Exchange Loop / Clockwise Turnaround Buffer -->
    <path d="M42 38 A38 38 0 1 1 34 68" stroke-width="4.5" stroke-dasharray="1 0" stroke-opacity="0.4"/>
    <path d="M42 30 L43 39 L34 40" stroke-width="4.5" stroke-opacity="0.6"/>

    <!-- Key Head (Squircle Tag) -->
    <rect x="36" y="52" width="28" height="28" rx="8" stroke-width="5" fill="#0369a1" fill-opacity="0.4"/>
    <circle cx="50" cy="66" r="5" fill="#ffffff" stroke="none"/>

    <!-- Key Shaft & Precision Teeth -->
    <path d="M64 66 H92" stroke-width="5"/>
    <path d="M80 66 V75" stroke-width="4.5"/>
    <path d="M88 66 V78" stroke-width="4.5"/>

    <!-- Fast Counter Flash Indicator / Star Sparkle -->
    <path d="M92 40 L94 45 L99 47 L94 49 L92 54 L90 49 L85 47 L90 45 Z" fill="#38bdf8" stroke="none"/>
  </g>
</svg>
